#
# CupriLex CI.
#
# This repository had none until the day it published a package, which is a worse order than it
# sounds: everything here was built and tested on one machine, by hand, and nothing said so.
#
# Two jobs. `build` runs on every push and pull request and is the one that has to stay honest.
# `publish` runs only on a tag and packs what `build` has already proved.
#
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

  # For the corpus-drift job. The corpus is pinned to a commit so that two measurements are
  # comparable; the cost is that the pin ages, and this is what notices.
  schedule:
    - cron: "17 6 * * 1"


env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The engine packages live on a private feed, and restore needs a token even for a public
      # package: GitHub Packages authenticates NuGet reads, unlike its npm and Maven registries.
      - name: Authenticate the package feed
        run: >
          dotnet nuget update source GitHub-Wixely-Packages
          --username ${{ github.actor }}
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # The corpus is somebody else's work and is not vendored. Fetching it here is what makes the
      # corpus-shaped tests mean anything; without it they skip and the suite reports green on
      # about a dozen fewer assertions than it looks like it ran.
      #
      # At the PINNED commit, so this job measures the same corpus the numbers in the docs
      # describe. Without the pin, a CI run could fail because upstream changed overnight - which
      # is exactly what happened on the first run of this workflow.
      - name: Fetch the corpus
        run: python tools/fetch-corpus.py

      # xunit v3 self-hosts. `dotnet test` does not work against it on this SDK, which cost an
      # afternoon to find out, so the test project is RUN and its exit code is the result.
      - name: Test
        run: dotnet run --project tests/CupriLex.Harness.Tests -c Release --no-build

      # The conformance matrix is measured, not asserted: it renders documents and records what
      # the engine did. Running it on CI proves the probe still works and that the committed
      # matrix was produced by something that executes.
      - name: Conformance matrix
        run: dotnet run --project conformance -c Release --no-build

      - name: Pack
        run: dotnet pack compiler -c Release --no-build -o dist

      # The check CupriFace learned the hard way: v0.28.0 announced CupriFace.Woff2 in its release
      # notes and packed nine packages. Everything else passed. So anything that does not opt out
      # with IsPackable=false must produce a nupkg, or this fails naming the project.
      - name: Every packable project produced a package
        shell: bash
        run: |
          set -euo pipefail
          for proj in compiler/*.csproj harness/*.csproj cli/*.csproj conformance/*.csproj; do
            grep -q '<IsPackable>false</IsPackable>' "$proj" && continue
            name=$(basename "$proj" .csproj)
            id=$(grep -oP '(?<=<PackageId>)[^<]+' "$proj" || echo "$name")
            ls dist/"$id".*.nupkg >/dev/null 2>&1 || {
              echo "::error::$name is packable and produced no nupkg. Give it IsPackable=false, or find out why pack skipped it."
              exit 1
            }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.nupkg

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Authenticate the package feed
        run: >
          dotnet nuget update source GitHub-Wixely-Packages
          --username ${{ github.actor }}
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text

      # The tag is the version, so a release cannot disagree with what it publishes.
      - name: Pack at the tagged version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dotnet pack compiler -c Release -p:Version="$version" -o dist

      - name: Publish
        run: >
          dotnet nuget push "dist/*.nupkg"
          --source GitHub-Wixely-Packages
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

  # ---------------------------------------------------------------------------------------------
  # Has upstream moved away from the pin?
  #
  # A pinned corpus is reproducible and goes stale, and the failure mode of stale is silence: the
  # numbers keep agreeing with each other and stop describing anything. This asks once a week and
  # says so in an issue, which is the difference between choosing when to move the pin and
  # finding out by accident.
  #
  # It never fails the build. Upstream changing is news, not a defect.
  corpus-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Compare the pin against upstream main
        shell: bash
        run: |
          if python tools/fetch-corpus.py --check; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            echo "pin=$(python tools/fetch-corpus.py --print-pin)" >> "$GITHUB_OUTPUT"
          fi

      - name: Say so, once
        if: steps.check.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIN: ${{ steps.check.outputs.pin }}
        shell: bash
        run: |
          set -euo pipefail
          title="The corpus pin has drifted from upstream"

          # One issue, not one a week. A reminder that arrives every Monday is a reminder nobody
          # reads by the third Monday.
          open=$(gh issue list --state open --search "$title in:title" --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "already open, saying nothing"
            exit 0
          fi

          # Written with a QUOTED heredoc so nothing in it is expanded, then the one value that
          # should be is substituted. An unquoted heredoc would run the backticks.
          cat > body.md <<'BODY'
          `tools/fetch-corpus.py` pins the HyperFrames corpus to `PIN_GOES_HERE`, and upstream
          `main` has moved on.

          That is not a problem by itself. The pin exists so that two measurements are comparable,
          and the numbers in the docs describe the pinned corpus rather than whatever upstream has
          today. This is here so the gap is a decision rather than a surprise.

          To move it: set `PIN` in `tools/fetch-corpus.py`, re-fetch with `--force`, run
          `dotnet run --project harness -- --all`, and commit the new hash **together with the
          numbers it produced**. They belong in one diff.

          Last time the corpus moved it lost 24 blocks and gained 9, and the mean fell 3.7 points
          with no code change. So expect the numbers to move, and expect that to mean nothing
          about the compiler.
          BODY

          sed -i "s/PIN_GOES_HERE/$PIN/" body.md
          gh issue create --title "$title" --body-file body.md
